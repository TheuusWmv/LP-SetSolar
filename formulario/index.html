<!DOCTYPE html>
<html lang="pt-BR" style="background-color: #ffffff; color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#2C2E33" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/simulador/favicon.svg?v=wp2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/simulador/favicon-32x32.png?v=wp2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/simulador/favicon-16x16.png?v=wp2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/simulador/apple-touch-icon.png?v=wp2" />
    <link rel="shortcut icon" href="/simulador/favicon.ico?v=wp2" />
    <title>Diagnóstico Solar | World Place Solar</title>
    <meta name="description" content="Simulação interativa de energia solar da World Place Solar." />
    
    <!-- Instant White Screen & Minimalist Loader Style (Zero Black Screen Delay) -->
    <style>
      html, body {
        background-color: #ffffff !important;
        color: #171717 !important;
        color-scheme: light !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: clip;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: loaderFadeIn 0.3s ease-out forwards;
      }

      .loader-logo {
        height: 44px;
        width: auto;
        max-width: 220px;
        object-fit: contain;
        margin-bottom: 26px;
        user-select: none;
      }

      .loader-track {
        width: 140px;
        height: 2.5px;
        background: #f1f5f9;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }

      .loader-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        background: #E9191B;
        border-radius: 999px;
        animation: solarPulse 1.2s cubic-bezier(0.23, 1, 0.32, 1) infinite;
      }

      @keyframes solarPulse {
        0% { left: -40%; width: 35%; }
        50% { left: 30%; width: 50%; }
        100% { left: 100%; width: 35%; }
      }

      @keyframes loaderFadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-neutral-900 antialiased min-h-screen overflow-x-clip">
    <div id="root">
      <!-- Minimalist Instant White Loader (Exclusively brand logo + progress bar) -->
      <div id="initial-loader" aria-label="Carregando formulário">
        <div class="loader-content">
          <img src="/simulador/logo-worldplace.svg" alt="World Place Solar" class="loader-logo" />
          <div class="loader-track">
            <div class="loader-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
